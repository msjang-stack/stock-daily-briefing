<title>장 마감 브리핑 — 레이아웃 시안</title>

<style>
  :root {
    --ground: #F8F7F4;
    --surface: #FFFFFF;
    --surface-2: #F1EFEA;
    --ink: #1C1B18;
    --ink-2: #57544D;
    --ink-3: #8B877E;
    --rule: #E6E3DC;
    --rule-2: #D3CFC6;
    --up: #C81E28;
    --up-bg: rgba(200, 30, 40, 0.09);
    --down: #1156BE;
    --down-bg: rgba(17, 86, 190, 0.09);
    --flat: #8B877E;
    --shadow: 0 1px 2px rgba(28, 27, 24, 0.04), 0 4px 16px rgba(28, 27, 24, 0.04);

    --sans: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", Pretendard,
            "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;

    --w: 620px;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --ground: #171614;
      --surface: #201F1C;
      --surface-2: #292824;
      --ink: #EFEDE8;
      --ink-2: #A5A199;
      --ink-3: #77736B;
      --rule: #302E2A;
      --rule-2: #403D38;
      --up: #FF6E63;
      --up-bg: rgba(255, 110, 99, 0.13);
      --down: #6FA8FF;
      --down-bg: rgba(111, 168, 255, 0.13);
      --flat: #77736B;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 4px 16px rgba(0, 0, 0, 0.22);
    }
  }

  :root[data-theme="dark"] {
    --ground: #171614;
    --surface: #201F1C;
    --surface-2: #292824;
    --ink: #EFEDE8;
    --ink-2: #A5A199;
    --ink-3: #77736B;
    --rule: #302E2A;
    --rule-2: #403D38;
    --up: #FF6E63;
    --up-bg: rgba(255, 110, 99, 0.13);
    --down: #6FA8FF;
    --down-bg: rgba(111, 168, 255, 0.13);
    --flat: #77736B;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 4px 16px rgba(0, 0, 0, 0.22);
  }

  :root[data-theme="light"] {
    --ground: #F8F7F4;
    --surface: #FFFFFF;
    --surface-2: #F1EFEA;
    --ink: #1C1B18;
    --ink-2: #57544D;
    --ink-3: #8B877E;
    --rule: #E6E3DC;
    --rule-2: #D3CFC6;
    --up: #C81E28;
    --up-bg: rgba(200, 30, 40, 0.09);
    --down: #1156BE;
    --down-bg: rgba(17, 86, 190, 0.09);
    --flat: #8B877E;
    --shadow: 0 1px 2px rgba(28, 27, 24, 0.04), 0 4px 16px rgba(28, 27, 24, 0.04);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    word-break: keep-all;
  }

  .num { font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; }

  .wrap {
    max-width: var(--w);
    margin: 0 auto;
    padding: 0 18px 72px;
  }

  /* ---------- 상단 고정 바 ---------- */
  .topbar {
    position: sticky;
    top: 0;
    z-index: 40;
    background: var(--ground);
    background: color-mix(in srgb, var(--ground) 88%, transparent);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--rule);
  }
  .topbar-inner {
    max-width: var(--w);
    margin: 0 auto;
    padding: 10px 18px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .brand {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: -0.01em;
    white-space: nowrap;
    color: var(--ink);
  }
  .search {
    position: relative;
    flex: 1;
    min-width: 0;
  }
  .search input {
    width: 100%;
    padding: 8px 12px 8px 32px;
    font-family: inherit;
    font-size: 14px;
    color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--rule-2);
    border-radius: 8px;
    outline: none;
  }
  .search input::placeholder { color: var(--ink-3); }
  .search input:focus {
    border-color: var(--ink-2);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--ink) 10%, transparent);
  }
  .search-icon {
    position: absolute;
    left: 10px; top: 50%;
    transform: translateY(-50%);
    width: 14px; height: 14px;
    color: var(--ink-3);
    pointer-events: none;
  }
  .results {
    position: absolute;
    top: calc(100% + 6px);
    left: 0; right: 0;
    background: var(--surface);
    border: 1px solid var(--rule-2);
    border-radius: 10px;
    box-shadow: var(--shadow);
    max-height: 320px;
    overflow-y: auto;
    display: none;
  }
  .results.open { display: block; }
  .result {
    display: flex;
    align-items: baseline;
    gap: 8px;
    width: 100%;
    padding: 9px 12px;
    background: none;
    border: none;
    border-bottom: 1px solid var(--rule);
    font-family: inherit;
    font-size: 14px;
    color: var(--ink);
    text-align: left;
    cursor: pointer;
  }
  .result:last-child { border-bottom: none; }
  .result:hover, .result:focus-visible { background: var(--surface-2); outline: none; }
  .result .code { font-size: 12px; color: var(--ink-3); }
  .result .chg { margin-left: auto; font-size: 13px; font-weight: 600; }
  .result .empty { color: var(--ink-3); }

  /* ---------- 머리말 ---------- */
  header.masthead { padding: 26px 0 20px; }
  .eyebrow {
    display: block;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.07em;
    color: var(--ink-3);
    margin-bottom: 7px;
  }
  h1 {
    margin: 0;
    font-size: 27px;
    line-height: 1.25;
    font-weight: 700;
    letter-spacing: -0.024em;
    text-wrap: balance;
  }
  .datebar {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 14px;
  }
  .datebar-label {
    font-size: 12px;
    font-weight: 600;
    color: var(--ink-3);
  }
  .datebar select {
    font-family: inherit;
    font-size: 13px;
    font-weight: 650;
    color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--rule-2);
    border-radius: 8px;
    padding: 6px 10px;
  }
  .datebar select:focus-visible {
    outline: 2px solid var(--ink-2);
    outline-offset: 1px;
  }
  .build-note {
    margin-left: auto;
    font-size: 11.5px;
    color: var(--ink-3);
    font-variant-numeric: tabular-nums;
  }
  .sample-flag {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-top: 12px;
    padding: 5px 10px;
    font-size: 12px;
    font-weight: 600;
    color: var(--ink-2);
    background: var(--surface-2);
    border: 1px dashed var(--rule-2);
    border-radius: 6px;
  }

  /* ---------- 섹션 공통 ---------- */
  section { margin-top: 34px; }
  .sec-head {
    display: flex;
    align-items: baseline;
    gap: 10px;
    margin-bottom: 13px;
  }
  h2 {
    margin: 0;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.09em;
    color: var(--ink-3);
  }
  .sec-note { font-size: 12px; color: var(--ink-3); margin-left: auto; }

  .card {
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 12px;
  }

  /* ---------- 지수 ---------- */
  .indices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  @media (max-width: 340px) { .indices { grid-template-columns: 1fr; } }

  .index { padding: 14px 13px 7px; }
  .index-name { font-size: 13px; font-weight: 700; color: var(--ink-2); }
  .index-val {
    margin-top: 5px;
    font-size: 27px;
    font-weight: 700;
    letter-spacing: -0.028em;
    line-height: 1.1;
  }
  .index-chg { margin-top: 3px; font-size: 13.5px; font-weight: 600; }
  .spark { display: block; width: 100%; height: 46px; margin-top: 8px; }
  .index-foot {
    display: flex;
    flex-direction: column;
    gap: 3px;
    margin-top: 8px;
    padding-top: 9px;
    border-top: 1px solid var(--rule);
    font-size: 11.5px;
    color: var(--ink-3);
  }
  .index-foot span {
    display: flex;
    justify-content: space-between;
    gap: 8px;
  }
  .index-foot b { font-weight: 650; color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .index-foot b.up { color: var(--up); }
  .index-foot b.down { color: var(--down); }
  .flow {
    display: flex;
    flex-direction: column;
    gap: 3px;
    margin-top: 7px;
    padding-top: 7px;
    border-top: 1px dashed var(--rule);
  }
  .flow-cap {
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 0.05em;
    color: var(--ink-3);
    margin-bottom: 1px;
  }
  .flow span {
    display: flex;
    justify-content: space-between;
    gap: 6px;
  }

  .up { color: var(--up); }
  .down { color: var(--down); }
  .flat { color: var(--flat); }

  /* ---------- 브리핑 ---------- */
  .briefing { padding: 16px 17px; }
  .briefing p { margin: 0; font-size: 15px; line-height: 1.72; color: var(--ink); }
  .briefing p + p { margin-top: 9px; color: var(--ink-2); font-size: 14px; }
  .breadth {
    display: flex;
    height: 5px;
    margin: 13px 0 7px;
    border-radius: 3px;
    overflow: hidden;
    gap: 2px;
  }
  .breadth i { display: block; height: 100%; }
  .breadth .b-up { background: var(--up); }
  .breadth .b-flat { background: var(--rule-2); }
  .breadth .b-down { background: var(--down); }
  .breadth-key { display: flex; gap: 13px; font-size: 11.5px; color: var(--ink-3); }

  /* ---------- 뉴스 ---------- */
  .news { overflow: hidden; }
  .news-item {
    display: block;
    padding: 13px 16px;
    border-bottom: 1px solid var(--rule);
    text-decoration: none;
    color: inherit;
  }
  .news-item:last-child { border-bottom: none; }
  .news-item:hover { background: var(--surface-2); }
  .news-title { font-size: 14.5px; font-weight: 600; line-height: 1.5; letter-spacing: -0.011em; }
  .news-meta { margin-top: 5px; font-size: 12px; color: var(--ink-3); display: flex; gap: 8px; }
  .news-tag {
    font-weight: 600;
    color: var(--ink-2);
    background: var(--surface-2);
    padding: 1px 6px;
    border-radius: 4px;
  }

  /* ---------- 주요 이슈 ---------- */
  .issues { overflow: hidden; }
  .issue-sum {
    margin-top: 6px;
    font-size: 13px;
    line-height: 1.55;
    color: var(--ink-2);
    letter-spacing: -0.008em;
  }

  /* ---------- 시장 선택 ---------- */
  .seg {
    display: flex;
    gap: 20px;
    margin-bottom: 12px;
    border-bottom: 1px solid var(--rule);
  }
  .market-seg { margin: 18px 0 0; }
  .market-seg .seg-btn { font-size: 16.5px; }
  .seg-btn {
    padding: 6px 1px 9px;
    font-family: inherit;
    font-size: 15.5px;
    font-weight: 700;
    letter-spacing: -0.016em;
    color: var(--ink-3);
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    cursor: pointer;
  }
  .seg-btn[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); }
  .seg-btn:focus-visible { outline: 2px solid var(--ink-2); outline-offset: 2px; }

  /* ---------- 탭 ---------- */
  .tabs {
    display: flex;
    gap: 4px;
    margin-bottom: 11px;
    background: var(--surface-2);
    padding: 3px;
    border-radius: 9px;
  }
  .tab {
    flex: 1;
    padding: 7px 10px;
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    color: var(--ink-3);
    background: none;
    border: none;
    border-radius: 7px;
    cursor: pointer;
  }
  .tab[aria-selected="true"] {
    background: var(--surface);
    color: var(--ink);
    box-shadow: var(--shadow);
  }
  .tab:focus-visible { outline: 2px solid var(--ink-2); outline-offset: 1px; }

  /* ---------- 종목 행 ---------- */
  .rows { overflow: hidden; }
  .row {
    display: grid;
    grid-template-columns: 22px 1fr auto;
    gap: 3px 11px;
    width: 100%;
    padding: 12px 15px;
    background: none;
    border: none;
    border-bottom: 1px solid var(--rule);
    font-family: inherit;
    text-align: left;
    color: inherit;
    cursor: pointer;
  }
  .row:last-child { border-bottom: none; }
  .row:hover { background: var(--surface-2); }
  .row:focus-visible { outline: 2px solid var(--ink-2); outline-offset: -2px; }
  .rank {
    grid-row: span 2;
    font-size: 12px;
    font-weight: 700;
    color: var(--ink-3);
    padding-top: 2px;
  }
  .r-name { font-size: 15px; font-weight: 650; letter-spacing: -0.014em; }
  .r-name .code { margin-left: 5px; font-size: 11.5px; font-weight: 500; color: var(--ink-3); }
  .r-price { text-align: right; font-size: 15px; font-weight: 650; }
  .r-chg { text-align: right; font-size: 13px; font-weight: 650; }
  .r-note {
    grid-column: 2 / 4;
    font-size: 12.5px;
    color: var(--ink-2);
    line-height: 1.5;
  }
  .r-note .val { color: var(--ink-3); }

  /* ---------- 내일 주목 ---------- */
  .watch-card {
    display: block;
    width: 100%;
    padding: 14px 15px;
    background: none;
    border: none;
    border-bottom: 1px solid var(--rule);
    font-family: inherit;
    color: inherit;
    text-align: left;
    cursor: pointer;
  }
  .watch-card:last-child { border-bottom: none; }
  .watch-card:hover { background: var(--surface-2); }
  .watch-card:focus-visible { outline: 2px solid var(--ink-2); outline-offset: -2px; }
  .watch-top { display: flex; align-items: baseline; gap: 8px; }
  .watch-name { font-size: 15.5px; font-weight: 700; letter-spacing: -0.015em; }
  .watch-name .code { margin-left: 5px; font-size: 11.5px; font-weight: 500; color: var(--ink-3); }
  .watch-price { margin-left: auto; text-align: right; }
  .watch-price .p { font-size: 14.5px; font-weight: 650; }
  .watch-price .c { font-size: 12.5px; font-weight: 650; }
  .chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 9px; }
  .chip {
    font-size: 11.5px;
    font-weight: 600;
    color: var(--ink-2);
    background: var(--surface-2);
    border: 1px solid var(--rule);
    padding: 3px 8px;
    border-radius: 5px;
  }
  .chip.hot { color: var(--up); background: var(--up-bg); border-color: transparent; }
  .watch-why { margin-top: 9px; font-size: 13px; line-height: 1.6; color: var(--ink-2); }

  /* ---------- 상세 시트 ---------- */
  .sheet-bg {
    position: fixed; inset: 0;
    background: rgba(0, 0, 0, 0.34);
    z-index: 60;
    display: none;
  }
  .sheet-bg.open { display: block; }
  .sheet {
    position: fixed;
    left: 50%; bottom: 0;
    transform: translateX(-50%);
    width: min(var(--w), 100%);
    max-height: 78vh;
    overflow-y: auto;
    background: var(--surface);
    border-radius: 16px 16px 0 0;
    z-index: 61;
    padding: 8px 18px 30px;
    display: none;
  }
  .sheet.open { display: block; }
  @media (prefers-reduced-motion: no-preference) {
    .sheet.open { animation: rise 0.22s cubic-bezier(0.2, 0.8, 0.3, 1); }
    @keyframes rise { from { transform: translate(-50%, 14px); opacity: 0; } }
  }
  .grabber {
    width: 34px; height: 4px;
    margin: 4px auto 14px;
    background: var(--rule-2);
    border-radius: 2px;
  }
  .sheet h3 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: -0.02em; }
  .sheet .code { font-size: 12.5px; color: var(--ink-3); font-weight: 500; margin-left: 6px; }
  .sheet-price { margin-top: 9px; font-size: 30px; font-weight: 700; letter-spacing: -0.03em; line-height: 1.1; }
  .sheet-chg { margin-top: 2px; font-size: 14px; font-weight: 650; }
  .stat-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1px;
    margin-top: 16px;
    background: var(--rule);
    border: 1px solid var(--rule);
    border-radius: 10px;
    overflow: hidden;
  }
  .stat { background: var(--surface); padding: 10px 12px; }
  .stat dt { font-size: 11.5px; color: var(--ink-3); font-weight: 600; }
  .stat dd { margin: 3px 0 0; font-size: 14.5px; font-weight: 650; }
  .sheet-note {
    margin-top: 14px;
    padding: 12px 13px;
    background: var(--surface-2);
    border-radius: 9px;
    font-size: 13.5px;
    line-height: 1.62;
    color: var(--ink-2);
  }
  /* --- 상세: 차트 --- */
  .sub {
    margin-top: 22px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.085em;
    color: var(--ink-3);
  }
  .chart-head { display: flex; align-items: baseline; gap: 10px; margin-top: 20px; }
  .chart-head .sub { margin-top: 0; }
  .legend { margin-left: auto; display: flex; gap: 12px; font-size: 11.5px; color: var(--ink-2); }
  .legend i {
    display: inline-block; width: 12px; height: 2px;
    margin-right: 5px; vertical-align: middle; border-radius: 1px;
  }
  .chart-wrap { position: relative; margin-top: 6px; }
  .chart { display: block; width: 100%; height: 200px; touch-action: none; }
  .chart-tip {
    position: absolute; top: 2px; left: 0;
    padding: 6px 9px; border-radius: 7px;
    background: var(--ink); color: var(--ground);
    font-size: 11.5px; line-height: 1.5;
    font-variant-numeric: tabular-nums;
    white-space: nowrap; pointer-events: none;
    opacity: 0; transition: opacity 0.12s;
    z-index: 2;
  }
  .chart-tip.on { opacity: 1; }
  @media (prefers-reduced-motion: reduce) { .chart-tip { transition: none; } }
  .chart-foot {
    display: flex; justify-content: space-between;
    margin-top: 2px; font-size: 11px; color: var(--ink-3);
    font-variant-numeric: tabular-nums;
  }

  /* --- 상세: 주목 이유 --- */
  .why-list { margin: 9px 0 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px; }
  .why-list li { display: grid; grid-template-columns: 15px 1fr; gap: 9px; font-size: 13.5px; line-height: 1.55; }
  .why-list .tick { color: var(--up); font-weight: 700; }
  .why-list b { font-weight: 650; color: var(--ink); }
  .why-list em { display: block; font-style: normal; font-size: 12.5px; color: var(--ink-3); margin-top: 1px; font-variant-numeric: tabular-nums; }

  .desc { margin-top: 8px; font-size: 13.5px; line-height: 1.68; color: var(--ink-2); }

  /* --- 상세: 뉴스 --- */
  .mini-news {
    margin-top: 9px;
    display: flex; flex-direction: column; gap: 1px;
    background: var(--rule);
    border: 1px solid var(--rule);
    border-radius: 10px;
    overflow: hidden;
  }
  .mini-news a { display: block; padding: 10px 12px; background: var(--surface); text-decoration: none; color: inherit; }
  .mini-news a:hover { background: var(--surface-2); }
  .mini-news .t { font-size: 13.5px; font-weight: 600; line-height: 1.5; letter-spacing: -0.01em; }
  .mini-news .m { margin-top: 4px; font-size: 11.5px; color: var(--ink-3); }
  .mini-news .t::after, .news-title::after {
    content: "↗";
    margin-left: 5px;
    font-size: 0.85em;
    font-weight: 500;
    color: var(--ink-3);
  }
  .empty-news { color: var(--ink-3); font-size: 13px; }
  .chart-loading { color: var(--ink-3); font-size: 13px; }
  .chart-slot { min-height: 40px; }

  .sheet-close {
    width: 100%;
    margin-top: 16px;
    padding: 11px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 650;
    color: var(--ink);
    background: var(--surface-2);
    border: 1px solid var(--rule-2);
    border-radius: 9px;
    cursor: pointer;
  }

  /* ---------- 꼬리말 ---------- */
  footer {
    margin-top: 40px;
    padding-top: 18px;
    border-top: 1px solid var(--rule);
    font-size: 12px;
    line-height: 1.65;
    color: var(--ink-3);
  }
  footer strong { color: var(--ink-2); font-weight: 650; }
</style>

    <div class="search">
      <svg class="search-icon" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <circle cx="7" cy="7" r="4.5" stroke="currentColor" stroke-width="1.6"></circle>
        <path d="M10.5 10.5 14 14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"></path>
      </svg>
      <input id="q" type="search" placeholder="종목명 또는 코드 검색" autocomplete="off"
             role="combobox" aria-expanded="false" aria-controls="results" aria-label="종목 검색">
      <div class="results" id="results" role="listbox"></div>
    </div>
  </div>
</div>

  <div id="marketView">
  <!-- 1. 지수 -->
  <section>
    <div class="sec-head"><h2>지수</h2><span class="sec-note" id="idxNote"></span></div>

  <!-- 2. 지수 브리핑 -->
  <section>

  <section>

    <div class="card news" id="news"></div>
  </section>

  <!-- 4. 주요 종목 -->
  <section>
    <div class="sec-head"><h2>주요 종목</h2></div>
    <div class="seg" role="tablist" aria-label="시장 선택" id="mktSeg">
      <button class="seg-btn" role="tab" aria-selected="true" data-mkt="KOSPI">코스피</button>
      <button class="seg-btn" role="tab" aria-selected="false" data-mkt="KOSDAQ">코스닥</button>
    </div>
    <div class="tabs" role="tablist" aria-label="정렬 기준">
      <button class="tab" role="tab" aria-selected="true" data-tab="value">거래대금 상위</button>
      <button class="tab" role="tab" aria-selected="false" data-tab="gain">등락률 상위</button>
    </div>
    <div class="card rows" id="rows"></div>

  <section>
    <div class="sec-head"><h2>내일 주목할 종목</h2><span class="sec-note">조건 충족순</span></div>
    <div class="card" id="watch"></div>

    <div class="sec-head"><h2>주요 이슈</h2><span class="sec-note" id="issueNote"></span></div>
    <div class="card issues" id="issues"></div>

  <footer>
    <strong>이 페이지는 자동으로 만들어진 참고 자료이며, 투자 권유가 아닙니다.</strong>
    종목 선정은 과거 가격과 거래량에서 계산한 기계적 조건에 따른 것으로, 앞으로의 수익을 보장하지 않습니다.
    투자 판단과 그 결과는 본인의 책임입니다.

<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="종목 상세"></div>

<script>
(function () {
  "use strict";

  /* ===== 데이터는 build.py가 주입합니다. 국내 시장은 페이지에 바로 담기고,
     미국 시장은 탭을 처음 누를 때 us.json을 받아옵니다. ===== */
  var KR_DATA = window.__DATA__ || {};
  var US_DATA = null;   // 아직 못 받아왔으면 null
  var D = KR_DATA, INDICES = [], NEWS = [], STOCKS = [], WATCH = [],
      INFO = {}, STOCK_NEWS = {}, CHARTS = {};
  var CUR = "KRW";       // 현재 탭의 통화. "KRW" 또는 "USD"
  var MARKET = "KR";     // 현재 탭. "KR" 또는 "US"

  /* ===== 유틸 ===== */

  function cls(v) { return v > 0 ? "up" : (v < 0 ? "down" : "flat"); }
  function sign(v) { return v > 0 ? "+" : (v < 0 ? "−" : ""); }
  function pct(v) { return sign(v) + Math.abs(v).toFixed(2) + "%"; }
  function won(v) { return v.toLocaleString("ko-KR"); }
  function arrow(v) { return v > 0 ? "▲" : (v < 0 ? "▼" : "―"); }

  function eok(v) {
    if (v >= 10000) return (v / 10000).toFixed(1) + "조원";
    return won(v) + "억원";
  }

  // 미국 종목은 원(억원) 단위가 아니라 달러 원액으로 옵니다.
  function usdBig(v) {
    var a = Math.abs(v);
    if (a >= 1e9) return "$" + (v / 1e9).toFixed(1) + "B";
    if (a >= 1e6) return "$" + (v / 1e6).toFixed(1) + "M";
    return "$" + Math.round(v).toLocaleString("en-US");
  }

  // 통화에 따라 가격·금액·수량 표기를 바꿉니다.
  function fmtPrice(v) { return CUR === "USD" ? "$" + v.toFixed(2) : won(v) + "원"; }
  function fmtMoney(v) { return CUR === "USD" ? usdBig(v) : eok(v); }
  function fmtDiff(v) {
    return CUR === "USD"
      ? sign(v) + "$" + Math.abs(v).toFixed(2)
      : sign(v) + won(Math.round(Math.abs(v))) + "원";
  }

  function el(tag, className, text) {
    var n = document.createElement(tag);
    if (className) n.className = className;
    if (text != null) n.textContent = text;
    return n;
  }

  /* ===== 뉴스 링크 =====
     실제 서비스에서는 네이버 검색 API가 돌려주는 기사 원문 주소(originallink)를 씁니다.
     시안에서는 가짜 제목이라 해당 키워드의 네이버 뉴스 검색 결과로 연결합니다. */

  function newsUrl(q) {
    return "https://search.naver.com/search.naver?where=news&query=" + encodeURIComponent(q);
  }

  function newsLink(n, query) {
    var a = el("a");
    a.href = n.url || newsUrl(query || n.t);
    a.target = "_blank";
    a.rel = "noopener noreferrer";
    a.appendChild(el("div", "t", n.t));
    a.appendChild(el("div", "m", n.s + " · " + n.w));
    return a;
  }

  /* ===== 지수 카드 ===== */

  function sparkPath(vals, w, h) {
    var min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
    var span = (max - min) || 1, pad = 4;
    return vals.map(function (p, i) {
      return [
        (i / (vals.length - 1 || 1)) * w,
        pad + (1 - (p - min) / span) * (h - pad * 2)
      ];
    });
  }

  function renderIndices() {
    var host = document.getElementById("indices");
    host.innerHTML = "";
    INDICES.forEach(function (ix, k) {
      var card = el("div", "card index");

      card.appendChild(el("div", "index-name", ix.name));

      var val = el("div", "index-val num", ix.val.toLocaleString("ko-KR", { minimumFractionDigits: 2 }));
      card.appendChild(val);

      var chg = el("div", "index-chg num " + cls(ix.pct));
      chg.textContent = arrow(ix.pct) + " " + Math.abs(ix.chg).toFixed(2) + "  " + pct(ix.pct);
      card.appendChild(chg);

      // 스파크라인
      var W = 260, H = 46;
      var svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      svg.setAttribute("class", "spark");
      svg.setAttribute("viewBox", "0 0 " + W + " " + H);
      svg.setAttribute("preserveAspectRatio", "none");
      svg.setAttribute("aria-hidden", "true");

      var pts = sparkPath(ix.series && ix.series.length > 1 ? ix.series : [0, 0], W, H);
      var color = ix.pct > 0 ? "var(--up)" : (ix.pct < 0 ? "var(--down)" : "var(--flat)");
      var d = pts.map(function (p, i) { return (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1); }).join(" ");

      var NS = "http://www.w3.org/2000/svg";
      var gid = "g" + k + Math.random().toString(36).slice(2, 7);
      var defs = document.createElementNS(NS, "defs");
      var grad = document.createElementNS(NS, "linearGradient");
      grad.setAttribute("id", gid);
      grad.setAttribute("x1", "0"); grad.setAttribute("y1", "0");
      grad.setAttribute("x2", "0"); grad.setAttribute("y2", "1");
      [["0%", "0.22"], ["100%", "0"]].forEach(function (st) {
        var stop = document.createElementNS(NS, "stop");
        stop.setAttribute("offset", st[0]);
        stop.setAttribute("stop-color", color);
        stop.setAttribute("stop-opacity", st[1]);
        grad.appendChild(stop);
      });
      defs.appendChild(grad);
      svg.appendChild(defs);

      var area = document.createElementNS("http://www.w3.org/2000/svg", "path");
      area.setAttribute("d", d + " L" + W + " " + H + " L0 " + H + " Z");
      area.setAttribute("fill", "url(#" + gid + ")");
      svg.appendChild(area);

      var line = document.createElementNS("http://www.w3.org/2000/svg", "path");
      line.setAttribute("d", d);
      line.setAttribute("fill", "none");
      line.setAttribute("stroke", color);
      line.setAttribute("stroke-width", "2");
      line.setAttribute("stroke-linejoin", "round");
      line.setAttribute("vector-effect", "non-scaling-stroke");
      svg.appendChild(line);

      var last = pts[pts.length - 1];
      var dot = document.createElementNS("http://www.w3.org/2000/svg", "circle");
      dot.setAttribute("cx", last[0].toFixed(1));
      dot.setAttribute("cy", last[1].toFixed(1));
      dot.setAttribute("r", "2.6");
      dot.setAttribute("fill", color);
      svg.appendChild(dot);

      if (ix.series && ix.series.length > 1) card.appendChild(svg);

      var foot = el("div", "index-foot");

      var f1 = el("span", null);
      f1.appendChild(el("span", null, "거래대금"));
      f1.appendChild(el("b", null, ix.value));
      foot.appendChild(f1);

      if (!ix.flow) { card.appendChild(foot); host.appendChild(card); return; }
      var flow = el("div", "flow");
      flow.appendChild(el("div", "flow-cap", "투자자 순매수"));
      ["개인", "외국인", "기관"].forEach(function (who) {
        var v = ix.flow[who];
        var line = el("span", null);
        line.appendChild(el("span", null, who));
        line.appendChild(el("b", "num " + cls(v), sign(v) + won(Math.abs(v)) + "억"));
        flow.appendChild(line);
      });
      foot.appendChild(flow);

      card.appendChild(foot);

      host.appendChild(card);
    });
  }

  /* ===== 등락 비율 막대 ===== */

  function renderBriefing() {
    var host = document.getElementById("briefing");
    host.innerHTML = "";
    var b = D.briefing || {};
    (b.lines || []).forEach(function (t) { host.appendChild(el("p", null, t)); });

    var br = b.breadth;
    if (!br) return;
    var bar = el("div", "breadth");
    bar.setAttribute("role", "img");
    bar.setAttribute("aria-label",
      "상승 " + br.up + "종목, 보합 " + br.flat + "종목, 하락 " + br.down + "종목");
    [["b-up", br.up], ["b-flat", br.flat], ["b-down", br.down]].forEach(function (x) {
      var i = el("i", x[0]);
      i.style.flex = String(Math.max(x[1], 1));
      bar.appendChild(i);
    });
    host.appendChild(bar);

    var key = el("div", "breadth-key");
    key.appendChild(el("span", "up", "상승 " + br.up));
    key.appendChild(el("span", null, "보합 " + br.flat));
    key.appendChild(el("span", "down", "하락 " + br.down));
    host.appendChild(key);
  }

  /* ===== 뉴스 ===== */

  function renderNews() {
    var host = document.getElementById("news");
    host.innerHTML = "";
    NEWS.forEach(function (n) {
      var a = el("a", "news-item");
      a.href = n.url || newsUrl(n.t);
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      a.appendChild(el("div", "news-title", n.t));
      var m = el("div", "news-meta");
      m.appendChild(el("span", "news-tag", n.tag));
      m.appendChild(el("span", null, n.s));
      m.appendChild(el("span", null, n.w));
      a.appendChild(m);
      host.appendChild(a);
    });
  }

  /* ===== 종목 행 ===== */

  function rowNode(s, rank) {
    var b = el("button", "row");
    b.type = "button";
    b.appendChild(el("div", "rank num", String(rank)));

    var nm = el("div", "r-name");
    nm.appendChild(document.createTextNode(s.n));
    nm.appendChild(el("span", "code num", s.c));
    b.appendChild(nm);

    var right = el("div", null);
    right.appendChild(el("div", "r-price num", fmtPrice(s.p)));
    var c = el("div", "r-chg num " + cls(s.pct), arrow(s.pct) + " " + pct(s.pct));
    right.appendChild(c);
    b.appendChild(right);

    var note = el("div", "r-note");
    note.innerHTML = '<span class="val num">거래대금 ' + fmtMoney(s.val) + '</span> · ' + s.note;
    b.appendChild(note);

    b.addEventListener("click", function () { openSheet(s); });
    return b;
  }

  var view = { mkt: "KOSPI", mode: "value" };

  function renderRows() {
    var host = document.getElementById("rows");
    host.innerHTML = "";
    var list = STOCKS.filter(function (s) { return s.mkt === view.mkt; });
    if (view.mode === "value") list.sort(function (a, b) { return b.val - a.val; });
    else list.sort(function (a, b) { return b.pct - a.pct; });
    list.slice(0, 10).forEach(function (s, i) { host.appendChild(rowNode(s, i + 1)); });
  }

  /* ===== 내일 주목 ===== */

  function renderWatch() {
    var host = document.getElementById("watch");
    host.innerHTML = "";
    if (!WATCH.length) {
      var empty = el("p", "desc empty-news", "조건을 충족한 종목이 없습니다.");
      empty.style.padding = "16px 17px";
      host.appendChild(empty);
      return;
    }
    WATCH.forEach(function (w) {
      var card = el("button", "watch-card");
      card.type = "button";
      card.addEventListener("click", function () { openSheet(w); });

      var top = el("div", "watch-top");
      var nm = el("div", "watch-name");
      nm.appendChild(document.createTextNode(w.n));
      nm.appendChild(el("span", "code num", w.c));
      top.appendChild(nm);

      var pr = el("div", "watch-price");
      pr.appendChild(el("div", "p num", fmtPrice(w.p)));
      pr.appendChild(el("div", "c num " + cls(w.pct), arrow(w.pct) + " " + pct(w.pct)));
      top.appendChild(pr);
      card.appendChild(top);

      var chips = el("div", "chips");
      w.chips.forEach(function (c, i) {
        chips.appendChild(el("span", "chip" + (i === w.hot ? " hot" : ""), c));
      });
      card.appendChild(chips);

      card.appendChild(el("div", "watch-why", w.why));
      host.appendChild(card);
    });
  }

  /* ===== 일봉 차트 ===== */

  var SVGNS = "http://www.w3.org/2000/svg";
  function svg(tag, attrs) {
    var n = document.createElementNS(SVGNS, tag);
    for (var k in attrs) if (attrs.hasOwnProperty(k)) n.setAttribute(k, attrs[k]);
    return n;
  }

  function movingAvg(arr, win) {
    return arr.map(function (_, i) {
      if (i < win - 1) return null;
      var s = 0;
      for (var j = i - win + 1; j <= i; j++) s += arr[j];
      return s / win;
    });
  }

  function fmtDay(yyyymmdd) {
    var t = String(yyyymmdd);
    return parseInt(t.slice(4, 6), 10) + "/" + parseInt(t.slice(6, 8), 10);
  }

  var CHART_CACHE = {};

  // 자주 보는 종목은 페이지에 들어있고, 나머지는 누를 때 파일 하나만 받아옵니다.
  function fetchSeries(code, done) {
    if (CHARTS[code]) return done(normalize(CHARTS[code]));
    if (code in CHART_CACHE) return done(CHART_CACHE[code]);
    if (!D.chartDir) return done(null);
    fetch(D.chartDir + code + ".json")
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (j) { CHART_CACHE[code] = normalize(j); done(CHART_CACHE[code]); })
      .catch(function () { CHART_CACHE[code] = null; done(null); });
  }

  function normalize(x) {
    if (!x || !x.c || x.c.length < 2) return null;
    return { dates: x.d, closes: x.c, vols: x.v };
  }

  function buildChart(w) {
    var host = el("div", "chart-block");
    var head = el("div", "chart-head");
    head.appendChild(el("span", "sub", "최근 시세"));
    host.appendChild(head);

    var slot = el("div", "chart-slot");
    slot.appendChild(el("p", "desc chart-loading", "차트를 불러오는 중입니다…"));
    host.appendChild(slot);

    fetchSeries(w.c, function (series) {
      slot.innerHTML = "";
      if (!series) {
        // 파일을 직접 열면(file://) 브라우저가 추가 파일 읽기를 막습니다.
        slot.appendChild(el("p", "desc empty-news",
          location.protocol === "file:"
            ? "차트는 웹 주소로 열었을 때 표시됩니다. 파일을 직접 열면 브라우저가 차단합니다."
            : "이 종목은 차트 데이터를 준비하지 못했습니다."));
        return;
      }
      head.firstChild.textContent = "최근 " + series.closes.length + "거래일";
      head.appendChild(legendNode(w));
      drawChart(slot, w, series);
    });
    return host;
  }

  function legendNode(w) {
    var main = (w.pct || 0) >= 0 ? "var(--up)" : "var(--down)";
    var lg = el("div", "legend");
    var l1 = el("span", null);
    l1.innerHTML = '<i style="background:' + main + '"></i>종가';
    var l2 = el("span", null);
    l2.innerHTML = '<i style="background:repeating-linear-gradient(90deg,var(--ink-3) 0 4px,transparent 4px 7px)"></i>20일선';
    lg.appendChild(l1); lg.appendChild(l2);
    return lg;
  }

  function drawChart(host, w, series) {
    var closes = series.closes, vols = series.vols, dates = series.dates;
    var DAYS = closes.length;
    var ma20 = movingAvg(closes, 20);

    var W = 320, H = 200, PX = 2, PT = 10;
    var priceH = 142, volTop = 162, volH = 30;

    var lo = Math.min.apply(null, closes), hi = Math.max.apply(null, closes);
    var span = (hi - lo) || 1;
    lo -= span * 0.08; hi += span * 0.08; span = hi - lo;

    function x(i) { return PX + (i / (DAYS - 1 || 1)) * (W - PX * 2); }
    function y(v) { return PT + (1 - (v - lo) / span) * (priceH - PT); }

    var box = el("div", "chart-wrap");
    var node = svg("svg", {
      "class": "chart", viewBox: "0 0 " + W + " " + H,
      preserveAspectRatio: "none", role: "img",
      "aria-label": w.n + " 최근 " + DAYS + "거래일 종가 추이"
    });

    [0.25, 0.5, 0.75].forEach(function (f) {
      node.appendChild(svg("line", {
        x1: 0, x2: W, y1: PT + f * (priceH - PT), y2: PT + f * (priceH - PT),
        stroke: "var(--rule)", "stroke-width": 1, "vector-effect": "non-scaling-stroke"
      }));
    });

    var up = (w.pct || 0) >= 0;
    var main = up ? "var(--up)" : "var(--down)";
    var d = closes.map(function (c, i) {
      return (i ? "L" : "M") + x(i).toFixed(1) + " " + y(c).toFixed(1);
    }).join(" ");

    var gid = "cg" + w.c;
    var defs = svg("defs", {});
    var grad = svg("linearGradient", { id: gid, x1: 0, y1: 0, x2: 0, y2: 1 });
    grad.appendChild(svg("stop", { offset: "0%", "stop-color": main, "stop-opacity": "0.20" }));
    grad.appendChild(svg("stop", { offset: "100%", "stop-color": main, "stop-opacity": "0" }));
    defs.appendChild(grad);
    node.appendChild(defs);

    node.appendChild(svg("path", {
      d: d + " L" + x(DAYS - 1) + " " + priceH + " L" + x(0) + " " + priceH + " Z",
      fill: "url(#" + gid + ")"
    }));

    var mstart = ma20.findIndex(function (v) { return v !== null; });
    if (mstart >= 0) {
      var md = ma20.slice(mstart).map(function (v, i) {
        return (i ? "L" : "M") + x(i + mstart).toFixed(1) + " " + y(v).toFixed(1);
      }).join(" ");
      node.appendChild(svg("path", {
        d: md, fill: "none", stroke: "var(--ink-3)", "stroke-width": 1.5,
        "stroke-dasharray": "4 3", "vector-effect": "non-scaling-stroke"
      }));
    }

    node.appendChild(svg("path", {
      d: d, fill: "none", stroke: main, "stroke-width": 2,
      "stroke-linejoin": "round", "vector-effect": "non-scaling-stroke"
    }));

    var vmax = Math.max.apply(null, vols) || 1;
    var bw = (W - PX * 2) / DAYS * 0.62;
    vols.forEach(function (v, i) {
      var h = Math.max(1, (v / vmax) * volH);
      node.appendChild(svg("rect", {
        x: (x(i) - bw / 2).toFixed(1), y: (volTop + volH - h).toFixed(1),
        width: bw.toFixed(1), height: h.toFixed(1), rx: 1,
        fill: i === DAYS - 1 ? main : "var(--rule-2)"
      }));
    });

    node.appendChild(svg("circle", { cx: x(DAYS - 1), cy: y(closes[DAYS - 1]), r: 3, fill: main }));

    var cross = svg("line", {
      x1: 0, x2: 0, y1: PT, y2: priceH, stroke: "var(--ink-3)",
      "stroke-width": 1, "vector-effect": "non-scaling-stroke", opacity: 0
    });
    var cdot = svg("circle", { r: 3.5, fill: main, stroke: "var(--surface)", "stroke-width": 2, opacity: 0 });
    node.appendChild(cross); node.appendChild(cdot);
    box.appendChild(node);

    var tip = el("div", "chart-tip");
    box.appendChild(tip);

    function hover(ev) {
      var rect = node.getBoundingClientRect();
      var px = ((ev.clientX - rect.left) / rect.width) * W;
      var i = Math.round(((px - PX) / (W - PX * 2)) * (DAYS - 1));
      i = Math.max(0, Math.min(DAYS - 1, i));
      cross.setAttribute("x1", x(i)); cross.setAttribute("x2", x(i));
      cross.setAttribute("opacity", 1);
      cdot.setAttribute("cx", x(i)); cdot.setAttribute("cy", y(closes[i]));
      cdot.setAttribute("opacity", 1);
      tip.textContent = fmtDay(dates[i]) + "  " + fmtPrice(closes[i]);
      tip.classList.add("on");
      var tw = tip.offsetWidth;
      var left = (x(i) / W) * rect.width - tw / 2;
      tip.style.left = Math.max(0, Math.min(rect.width - tw, left)) + "px";
    }
    function leave() {
      cross.setAttribute("opacity", 0);
      cdot.setAttribute("opacity", 0);
      tip.classList.remove("on");
    }
    node.addEventListener("pointermove", hover);
    node.addEventListener("pointerdown", hover);
    node.addEventListener("pointerleave", leave);

    host.appendChild(box);

    var foot = el("div", "chart-foot");
    foot.appendChild(el("span", null, fmtDay(dates[0])));
    foot.appendChild(el("span", null, "오늘"));
    host.appendChild(foot);
  }

  /* ===== 상세 시트 ===== */

  var sheet = document.getElementById("sheet");
  var sheetBg = document.getElementById("sheetBg");
  var lastFocus = null;

  function openSheet(s) {
    lastFocus = document.activeElement;
    sheet.innerHTML = "";
    sheet.appendChild(el("div", "grabber"));

    var h = el("h3", null, s.n);
    h.appendChild(el("span", "code num", s.c + " · " + s.mkt));
    sheet.appendChild(h);

    sheet.appendChild(el("div", "sheet-price num", fmtPrice(s.p)));
    sheet.appendChild(el("div", "sheet-chg num " + cls(s.pct), arrow(s.pct) + " " + pct(s.pct)));

    // 전일 종가 대비 실제 변동액, 거래대금에서 역산한 거래량
    var diff = s.p - s.p / (1 + s.pct / 100);
    var vol = CUR === "USD" ? Math.round(s.val / s.p) : Math.round(s.val * 1e8 / s.p);

    var g = el("dl", "stat-grid");
    [["거래대금", fmtMoney(s.val)],
     ["거래량", won(vol) + "주"],
     ["전일대비", fmtDiff(diff)],
     ["시장", s.mkt]]
      .forEach(function (x) {
        var d = el("div", "stat");
        d.appendChild(el("dt", null, x[0]));
        d.appendChild(el("dd", "num", x[1]));
        g.appendChild(d);
      });
    sheet.appendChild(g);

    // 모든 종목 공통: 차트
    sheet.appendChild(buildChart({
      n: s.n, c: s.c, p: s.p, pct: s.pct, peak: s.peak,
      seed: s.seed != null ? s.seed : (parseInt(s.c, 10) % 9973),
      drift: s.drift != null ? s.drift : Math.max(-0.004, Math.min(0.004, s.pct * 0.0006))
    }));

    // 주목 종목만: 선정 근거
    if (s.checks) {
      sheet.appendChild(el("div", "sub", "왜 주목하나"));
      var ul = el("ul", "why-list");
      s.checks.forEach(function (c) {
        var li = el("li");
        li.appendChild(el("span", "tick", "✓"));
        var t = el("div");
        t.appendChild(el("b", null, c[0]));
        t.appendChild(el("em", null, c[1]));
        li.appendChild(t);
        ul.appendChild(li);
      });
      sheet.appendChild(ul);
    } else if (s.note) {
      sheet.appendChild(el("div", "sub", "오늘의 움직임"));
      sheet.appendChild(el("p", "desc", s.note));
    }

    // 회사 설명
    var desc = s.desc || INFO[s.c];
    if (desc) {
      sheet.appendChild(el("div", "sub", "어떤 회사인가"));
      sheet.appendChild(el("p", "desc", desc));
    }

    // 관련 뉴스
    sheet.appendChild(el("div", "sub", "관련 뉴스"));
    var items = s.news || STOCK_NEWS[s.c];
    if (items && items.length) {
      var nb = el("div", "mini-news");
      items.forEach(function (n) { nb.appendChild(newsLink(n, s.n)); });
      sheet.appendChild(nb);
    } else {
      sheet.appendChild(el("p", "desc empty-news", "최근 3일 내 관련 뉴스가 없습니다."));
    }

    var btn = el("button", "sheet-close", "닫기");
    btn.type = "button";
    btn.addEventListener("click", closeSheet);
    sheet.appendChild(btn);

    sheet.classList.add("open");
    sheetBg.classList.add("open");
    btn.focus();
  }

  function closeSheet() {
    sheet.classList.remove("open");
    sheetBg.classList.remove("open");
    if (lastFocus) lastFocus.focus();
  }

  sheetBg.addEventListener("click", closeSheet);
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") { closeSheet(); closeResults(); }
  });

  /* ===== 검색 ===== */

  var q = document.getElementById("q");
  var results = document.getElementById("results");

  function closeResults() {
    results.classList.remove("open");
    q.setAttribute("aria-expanded", "false");
  }

  function search() {
    var v = q.value.trim().toLowerCase();
    results.innerHTML = "";
    if (!v) { closeResults(); return; }

    var hits = STOCKS.filter(function (s) {
      return s.n.toLowerCase().indexOf(v) > -1 || s.c.indexOf(v) > -1;
    }).slice(0, 8);

    if (!hits.length) {
      var none = el("div", "result");
      none.appendChild(el("span", "empty", "'" + q.value + "' 검색 결과가 없습니다"));
      results.appendChild(none);
    } else {
      hits.forEach(function (s) {
        var b = el("button", "result");
        b.type = "button";
        b.setAttribute("role", "option");
        b.appendChild(document.createTextNode(s.n));
        b.appendChild(el("span", "code num", s.c));
        b.appendChild(el("span", "chg num " + cls(s.pct), pct(s.pct)));
        b.addEventListener("click", function () {
          closeResults();
          q.value = "";
          openSheet(s);
        });
        results.appendChild(b);
      });
    }
    results.classList.add("open");
    q.setAttribute("aria-expanded", "true");
  }

  q.addEventListener("input", search);
  q.addEventListener("focus", function () { if (q.value.trim()) search(); });
  document.addEventListener("click", function (e) {
    if (!e.target.closest(".search")) closeResults();
  });

  /* ===== 탭 ===== */

  function wire(sel, apply) {
    var btns = document.querySelectorAll(sel);
    Array.prototype.forEach.call(btns, function (t) {
      t.addEventListener("click", function () {
        Array.prototype.forEach.call(btns, function (x) {
          x.setAttribute("aria-selected", String(x === t));
        });
        apply(t);
        renderRows();
      });
    });
  }

  wire("#mktSeg .seg-btn", function (t) { view.mkt = t.dataset.mkt; });
  wire(".tab", function (t) { view.mode = t.dataset.tab; });

  /* ===== 시장(국내/미국) 전환 =====
     국내 데이터는 페이지에 이미 담겨 있고, 미국 데이터는 탭을 처음 누를 때
     us.json을 받아옵니다. 실패해도 국내 탭은 그대로 쓸 수 있어야 합니다. */

  function renderAll(data, marketKey) {
    D = data || {};
    INDICES = D.indices || [];
    NEWS = D.news || [];
    STOCKS = D.stocks || [];
    WATCH = D.watch || [];
    INFO = D.info || {};
    STOCK_NEWS = D.stockNews || {};
    CHARTS = D.charts || {};
    CUR = D.currency || "KRW";
    MARKET = marketKey;

    closeSheet();
    closeResults();
    q.value = "";

    var mktSeg = document.getElementById("mktSeg");
    if (marketKey === "US") {
      mktSeg.style.display = "none";
      view.mkt = "US";
    } else {
      mktSeg.style.display = "";
      var segBtns = mktSeg.querySelectorAll(".seg-btn");
      Array.prototype.forEach.call(segBtns, function (b, i) {
        b.setAttribute("aria-selected", String(i === 0));
      });
      view.mkt = segBtns.length ? segBtns[0].dataset.mkt : "KOSPI";
    }
    view.mode = "value";
    Array.prototype.forEach.call(document.querySelectorAll(".tabs .tab"), function (b, i) {
      b.setAttribute("aria-selected", String(i === 0));
    });

    document.getElementById("eyebrow").textContent = (D.weekday || "") + " 장 마감";
    document.getElementById("headline").textContent = (D.dateLabel || "") + " 마감 시황";
    document.getElementById("idxNote").textContent = D.closeNote || "종가 기준";
    document.getElementById("buildNote").textContent = D.builtAt ? "데이터 생성 " + D.builtAt : "";
    document.title = (D.dateLabel || "") + " 마감 시황";

    renderIndices();
    renderBriefing();
    renderNews();
    renderRows();
    renderWatch();
  }

  function switchMarket(key) {
    Array.prototype.forEach.call(document.querySelectorAll("#marketSeg .seg-btn"), function (b) {
      b.setAttribute("aria-selected", String(b.dataset.market === key));
    });

    // 주요 이슈는 국내·미국과 달리 '지금' 기준의 흐름이라 날짜·종목 화면을 통째로 바꿉니다.
    var isIssue = key === "ISSUE";
    document.getElementById("marketView").hidden = isIssue;
    document.getElementById("issueView").hidden = !isIssue;
    // 이슈는 날짜 개념이 없어 날짜 선택을 숨깁니다. CSS에서 display를 지정한
    // 요소라 hidden 속성만으로는 안 숨어서 display를 직접 건드립니다.
    var datebar = document.querySelector(".datebar");
    if (datebar) datebar.style.display = isIssue ? "none" : "";
    // 검색은 종목 검색이라 이슈 탭에서는 쓸 일이 없습니다.
    var search = document.querySelector(".topbar .search");
    if (search) search.style.display = isIssue ? "none" : "";
    if (isIssue) {
      document.getElementById("eyebrow").textContent = "시장 전체";
      document.getElementById("headline").textContent = "주요 이슈";
      showIssues();
      return;
    }

    if (key === MARKET) return;
    if (key === "KR") { renderAll(KR_DATA, "KR"); return; }
    if (US_DATA) { renderAll(US_DATA, "US"); return; }
    document.getElementById("indices").innerHTML =
      '<p class="desc empty-news" style="padding:14px 2px;">미국 시장 데이터를 불러오는 중입니다…</p>';
    fetch("us.json")
      .then(function (r) { if (!r.ok) throw new Error(String(r.status)); return r.json(); })
      .then(function (data) { US_DATA = data; renderAll(US_DATA, "US"); })
      .catch(function () {
        document.getElementById("indices").innerHTML =
          '<p class="desc empty-news" style="padding:14px 2px;">미국 시장 데이터를 아직 준비하지 못했습니다.</p>';
      });
  }

  /* ===== 주요 이슈 =====
     국내·미국과 완전히 따로 도는 데이터라, 탭을 처음 누를 때 issues.json을 받아옵니다. */

  var ISSUE_DATA = null;

  function renderIssues(data) {
    var host = document.getElementById("issues");
    var note = document.getElementById("issueNote");
    host.innerHTML = "";
    var items = (data && data.items) || [];
    note.textContent = data && data.builtAt ? "데이터 생성 " + data.builtAt : "";
    if (!items.length) {
      host.appendChild(el("p", "desc empty-news", "표시할 이슈가 없습니다."));
      return;
    }
    items.forEach(function (n) {
      var a = el("a", "news-item");
      a.href = n.url;
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      a.appendChild(el("div", "news-title", n.t));
      if (n.sum) a.appendChild(el("div", "issue-sum", n.sum));
      var m = el("div", "news-meta");
      if (n.tag) m.appendChild(el("span", "news-tag", n.tag));
      if (n.s) m.appendChild(el("span", null, n.s));
      if (n.w) m.appendChild(el("span", null, n.w));
      a.appendChild(m);
      host.appendChild(a);
    });
  }

  function showIssues() {
    MARKET = "ISSUE";
    if (ISSUE_DATA) { renderIssues(ISSUE_DATA); return; }
    document.getElementById("issues").innerHTML =
      '<p class="desc empty-news" style="padding:14px 2px;">이슈를 불러오는 중입니다…</p>';
    fetch("issues.json", { cache: "no-store" })
      .then(function (r) { if (!r.ok) throw new Error(String(r.status)); return r.json(); })
      .then(function (data) { ISSUE_DATA = data; renderIssues(data); })
      .catch(function () {
        document.getElementById("issues").innerHTML =
          '<p class="desc empty-news" style="padding:14px 2px;">이슈를 아직 준비하지 못했습니다.</p>';
      });
  }

  // 이슈는 '지금' 기준이라 날짜별 기록에는 없습니다. 지난 날짜 페이지에서는 탭 자체를 숨깁니다.
  if (location.pathname.indexOf("/archive/") === -1) {
    document.getElementById("issueTab").hidden = false;
  }

  Array.prototype.forEach.call(document.querySelectorAll("#marketSeg .seg-btn"), function (b) {
    b.addEventListener("click", function () { switchMarket(b.dataset.market); });
  });

  /* ===== 초기 렌더 ===== */

  renderAll(KR_DATA, "KR");

  /* ===== 날짜 선택 =====
     아카이브 목록은 페이지가 만들어진 시점이 아니라 여는 시점에 받아오므로,
     오래전에 생성된 과거 날짜 페이지에서도 그 뒤에 쌓인 최신 날짜까지 골라볼 수 있습니다. */
  (function () {
    var sel = document.getElementById("dateSelect");
    if (!sel) return;

    // 이 페이지가 '어느 날짜의 페이지인지'는 국내 데이터로 고정합니다.
    // D는 미국 탭으로 옮기면 미국 데이터로 바뀌어서 기준으로 쓸 수 없습니다.
    var pageDate = KR_DATA.dateISO || "";
    var onArchive = location.pathname.indexOf("/archive/") !== -1;
    var newest = "";

    function isReload() {
      try {
        var nav = performance.getEntriesByType("navigation")[0];
        if (nav) return nav.type === "reload";
        return !!(performance.navigation && performance.navigation.type === 1);
      } catch (e) { return false; }
    }

    // 목록은 항상 서버에서 새로 받습니다. 캐시된 옛 목록을 쓰면 방금 올라온
    // 날짜가 안 보여서 "새로고침해도 최신이 아니다"가 됩니다.
    fetch("/archive/manifest.json", { cache: "no-store" })
      .then(function (r) { if (!r.ok) throw new Error(String(r.status)); return r.json(); })
      .then(function (list) {
        if (!list || !list.length) return;
        newest = list[0].iso; // manifest는 최신순

        // 지난 날짜를 보다가 새로고침하면 최신으로 돌아옵니다. 날짜를 골라
        // 들어가는 것은 그대로 두고, 새로고침만 최신으로 보냅니다.
        if (onArchive && pageDate !== newest && isReload()) { location.replace("/"); return; }

        sel.innerHTML = "";
        list.forEach(function (d) {
          var opt = document.createElement("option");
          opt.value = d.iso;
          opt.textContent = d.iso === newest ? d.label + " · 최신" : d.label;
          if (d.iso === pageDate) opt.selected = true;
          sel.appendChild(opt);
        });
      })
      .catch(function () { /* 아카이브가 아직 없으면 '오늘' 하나만 남습니다 */ });

    sel.addEventListener("change", function () {
      var v = sel.value;
      if (!v || v === pageDate) return;
      // 최신 날짜는 항상 루트로 보냅니다 — 지난 날짜 기록에는 종목별 차트
      // 파일이 없어서(용량 문제로 제외), 같은 날짜라도 루트가 더 완전합니다.
      if (v === newest) { location.href = "/"; return; }
      location.href = "/archive/" + v + "/";
    });
  })();
})();
</script>
