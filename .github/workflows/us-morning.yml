name: Build US market (morning)

on:
  schedule:
    # 한국시간 아침 07:00 (UTC 22:00 전날). 미국 장은 서머타임 여부에 따라
    # 한국시간 05:00~06:00에 끝나므로 충분히 지난 시각입니다.
    # UTC 일~금(0-5)에 돌립니다 — 금요일 22:00 UTC(=토요일 07:00 KST) 실행이
    # 빠지면 금요일 미국 장 마감 데이터가 월요일 아침까지 갱신되지 않는
    # 문제가 있어(0-4로는 금요일이 빠짐) 금요일도 포함합니다. 토요일 22:00
    # UTC(=일요일 07:00 KST)는 새로 생기는 거래일이 없어 그대로 뺍니다.
    - cron: "0 22 * * 0-5"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# 국내 빌드(daily.yml)와 배포가 겹치지 않도록 같은 그룹으로 묶습니다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt

      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: cache
          # 국내 빌드(daily.yml)가 남긴 cache/kr_latest/를 이어받아 assemble.py가
          # 국내 페이지는 그대로 두고 미국 데이터만 새로 얹을 수 있게 합니다.
          key: krx-cache-morning-${{ github.run_id }}
          restore-keys: krx-cache-

      - name: Build US
        run: python run_us.py

      - name: Assemble (아카이브는 국내 빌드가 담당)
        run: python assemble.py

      - name: Deploy to Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != ''
        # Cloudflare 배포가 실패해도(네트워크 문제 등 일시적 원인 포함) 아래
        # GitHub Pages 배포까지 같이 막히지 않도록 continue-on-error로 분리합니다
        # — 예전엔 여기서 실패하면 Upload/Pages 배포 단계가 통째로 건너뛰어져
        # 두 배포처 모두 갱신되지 않는 문제가 있었습니다(2026-08-21 실제 발생).
        continue-on-error: true
        run: |
          for i in 1 2 3; do
            npx --yes wrangler@4 pages deploy dist \
              --project-name=${{ vars.CF_PROJECT_NAME || 'stock-daily-briefing' }} \
              --branch=main \
              --commit-dirty=true && exit 0
            echo "Cloudflare 배포 실패, 재시도 ($i/3)"
            sleep 10
          done
          exit 1

      - name: Upload for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
