name: add-og-images
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode OG images
        run: |
          set -euo pipefail
          mkdir -p og
          printf '%s' '' | base64 -d > og/haru-ai-daily.png
          printf '%s' '' | base64 -d > og/kr-close-briefing.png
          printf '%s' '' | base64 -d > og/us-close-briefing.png
          file og/*.png
      - name: Commit and push
        run: |
          git config user.name "msjang-stack"
          git config user.email "msjang-stack@users.noreply.github.com"
          git add og/
          git commit -m "Add OG images for miniapp share links"
          git push
