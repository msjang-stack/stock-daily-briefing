name: Build KR page

on:
  schedule:
    # 평일 16:40 KST (UTC 07:40)
    - cron: "40 7 * * 1-5"
  workflow_dispatch:
    inputs:
      chart_limit:
        description: "차트를 준비할 종목 수"
        required: false
        default: "1200"

permissions:
  contents: read
  pages: write
  id-token: write

# 배포가 겹치지 않도록 한 번에 하나씩만 진행합니다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Cloudflare 키가 없으면 아래 배포 단계는 건너뜁니다.
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    outputs:
      kr_date: ${{ steps.expected.outputs.date }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt

      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: cache
          key: krx-cache-${{ github.run_id }}
          restore-keys: krx-cache-

      - name: Build KR
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          CHART_LIMIT: ${{ github.event.inputs.chart_limit || '1200' }}
        run: python run_kr.py

      - name: Assemble + archive
        run: python assemble.py --archive

      - name: 이번에 만든 날짜 기록 (배포 확인용)
        id: expected
        run: echo "date=$(python3 -c "import json;print(json.load(open('cache/kr_latest/meta.json'))['dateISO'])")" >> "$GITHUB_OUTPUT"

      - name: Deploy to Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != ''
        # Cloudflare 배포가 실패해도(네트워크 문제 등 일시적 원인 포함) 아래
        # GitHub Pages 배포까지 같이 막히지 않도록 continue-on-error로 분리합니다
        # — 예전엔 여기서 실패하면 Upload/Pages 배포 단계가 통째로 건너뛰어져
        # 두 배포처 모두 갱신되지 않는 문제가 있었습니다(2026-08-21 실제 발생).
        continue-on-error: true
        run: |
          for i in 1 2 3; do
            npx --yes wrangler@4 pages deploy dist \
              --project-name=${{ vars.CF_PROJECT_NAME || 'stock-daily-briefing' }} \
              --branch=main \
              --commit-dirty=true && exit 0
            echo "Cloudflare 배포 실패, 재시도 ($i/3)"
            sleep 10
          done
          exit 1

      - name: Upload for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: 라이브 사이트가 실제로 갱신됐는지 확인
        # 빌드·배포 단계가 전부 "성공"으로 끝나도 실제 라이브 사이트가
        # 그 내용을 서빙하는지는 별개입니다(2026-08-21처럼 Cloudflare가
        # 조용히 실패하는 경우 포함) — 그래서 방금 만든 국내 거래일이
        # 실제 두 배포처 중 한 곳에서라도 조회되는지 직접 확인합니다.
        # 국내 페이지는 별도 JSON이 아니라 index.html에 window.__DATA__로
        # 내장돼 있어 dateISO 문자열이 그대로 들어있는지로 확인합니다.
        run: |
          expected="${{ needs.build.outputs.kr_date }}"
          if [ -z "$expected" ]; then
            echo "::warning::확인할 날짜를 못 얻어 이 단계는 건너뜁니다"
            exit 0
          fi
          ok=0
          for url in "https://stock-daily-briefing.pages.dev/" "https://msjang-stack.github.io/stock-daily-briefing/"; do
            for i in 1 2 3 4 5; do
              if curl -fsS "$url" 2>/dev/null | grep -qF "\"dateISO\":\"$expected\""; then
                echo "[배포 확인] $url → $expected 확인됨"
                ok=1
                break
              fi
              sleep 6
            done
          done
          if [ "$ok" != "1" ]; then
            echo "::error::라이브 사이트 어디에서도 방금 만든 국내 데이터($expected)를 확인하지 못했습니다"
            exit 1
          fi
